<svg xmlns="http://www.w3.org/2000/svg" width="220" height="220" viewBox="0 0 220 220">
  <!-- Procedural paper/clay grain: fine dark specks with transparent gaps. -->
  <filter id="g" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
    <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" seed="3" stitchTiles="stitch"/>
    <feColorMatrix type="matrix" values="0 0 0 0 0.24  0 0 0 0 0.16  0 0 0 0 0.09  2.2 0 0 0 -1.12"/>
  </filter>
  <rect width="220" height="220" filter="url(#g)" opacity="0.28"/>
</svg>
